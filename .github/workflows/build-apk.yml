name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # también se puede lanzar a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Android SDK
        run: |
          # No usamos la acción de terceros "android-actions/setup-android":
          # últimamente falla porque intenta instalar un paquete ("tools")
          # que Google ya sacó de sus repositorios. Bajamos el SDK directo
          # de Google, que es más simple y no depende de que un tercero
          # mantenga su acción al día.
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permiso de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK (debug, listo para instalar en el celular)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: apuntes-u-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
