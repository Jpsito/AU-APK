name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # también se puede lanzar a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Asegurar la plataforma de Android que pide el proyecto
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permiso de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK (debug, listo para instalar en el celular)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: apuntes-u-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
